[Rainmeter]
Update=1000

[Metadata]
Name=Timetable
Author=You

[Variables]
FontFace=Microsoft YaHei
FontSize=14
TitleSize=18
FontColor=255,255,255,255
AccentColor=255,200,0,255

; 背景板尺寸与透明度
BgWidth=260
BgHeight=310
BgAlpha=60

[MeasureTimetable]
Measure=Script
ScriptFile=Timetable.lua

; ---------- 半透明背景板（写在文字前面，才会在底层） ----------
[Background]
Meter=Shape
Shape=Rectangle 0,0,#BgWidth#,#BgHeight#,12 | Fill Color 0,0,0,#BgAlpha# | StrokeWidth 0
X=0
Y=0

; ---------- 课程文字 ----------
[MeterTimetable]
Meter=String
MeasureName=MeasureTimetable
X=18
Y=16
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#FontColor#
AntiAlias=1
Text="%1"
LineHeight=22
InlineSetting=Color | 255,200,0,255
InlineSetting2=Size | #TitleSize#
InlinePattern=^周. 课程表